name: Integration Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        repo:
        - Autofac
        - Bshox
        - Serilog
        # - Moq # TODO: fix on linux
        # - NUnit # TODO: fix on linux
        include:
        - os: "windows-latest"
          repo: "Moq"
        - os: "windows-latest"
          repo: "NUnit"
        - os: "macos-latest"
          repo: "Bshox"
    runs-on: ${{ matrix.os }}

    name: Testing ${{ matrix.repo }} on ${{ matrix.os }}

    steps:
    - name: ⤵️ Checkout Source
      uses: actions/checkout@v7

    - name: 🕒 Cache NuGet Packages
      uses: actions/cache@v6
      id: cache
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-${{ matrix.repo }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.repo }}
          ${{ runner.os }}-nuget

    - name: ⤵️ Checkout ${{ matrix.repo }} Submodule
      run: git submodule update --init --recursive Tests/Integration/${{ matrix.repo }}

    - name: 🛠️ Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        dotnet-version: |
          8.0.x
          9.0.x

    - name: 🛠️ Restore dependencies
      run: dotnet restore src/Vilens.MSBuild

    - name: 🧪 Test
      shell: pwsh
      run: ./IntegrationTests.ps1 ${{ matrix.repo }}
